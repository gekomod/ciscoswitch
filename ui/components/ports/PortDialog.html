<dialog class="port-dialog" id="port-dialog" aria-labelledby="port-dialog-title"><div class="dialog-head"><div><h2 id="port-dialog-title">Ustawienia portu</h2><p>Zmiany są najpierw prezentowane do zatwierdzenia, a następnie wysyłane do switcha.</p></div><button class="dialog-close" id="close-port-dialog" type="button" aria-label="Zamknij">×</button></div><div class="form-grid port-form"><label>Port<select id="cfg-port"><option value="">Najpierw pobierz porty</option></select></label><label>Tryb<select id="cfg-mode"><option value="access">Access</option><option value="trunk">Trunk</option></select></label><label>Opis portu<input id="cfg-description" maxlength="64" placeholder="np. AP biuro"></label><label>Access VLAN<input id="cfg-access-vlan" type="number" min="1" max="4094" value="1"></label><label>Dozwolone VLAN-y trunk<input id="cfg-allowed" placeholder="np. 10,20,30 lub 10-30"></label><label>Native VLAN<input id="cfg-native" type="number" min="1" max="4094" value="1"></label><label>Prędkość<select id="cfg-speed"><option value="auto">Auto</option><option value="10">10 Mb/s</option><option value="100">100 Mb/s</option><option value="1000">1000 Mb/s</option><option value="10000">10000 Mb/s (SFP+)</option></select></label><label>Duplex<select id="cfg-duplex"><option value="auto">Auto</option><option value="full">Full</option><option value="half">Half</option></select></label><div class="form-actions"><button class="btn primary" id="apply-port-settings">Zastosuj ustawienia portu</button></div></div><div id="cfg-load-status" class="note" role="status">Przed zmianą panel odczyta bieżący tryb i VLAN portu.</div><div class="note">Uwaga: zmiana VLAN na porcie uplink może odciąć dostęp do switcha. Nie zmieniaj portu, którym łączysz się z panelem, bez dostępu awaryjnego.</div></dialog>
