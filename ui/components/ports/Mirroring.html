<section class="panel mon-panel" id="mirroring"><div class="section-head"><div><h2>Mirroring portów</h2><p>Kopiuje ruch z wybranego portu na inny port, do którego podłączysz komputer z Wiresharkiem. Port docelowy przestaje działać jak zwykły port.</p></div><div class="svc-head-actions"><small id="mirror-updated" class="svc-updated"></small><button class="btn primary" id="mirror-refresh">Odczytaj mirroring</button></div></div><div id="mirror-list"><p class="mon-note">Kliknij „Odczytaj mirroring”.</p></div><h3 class="files-h3">Nowy mirroring</h3><form id="mirror-form" class="mon-form"><label>Kopiuj ruch z portu<select id="mirror-source"></select></label><label>Kierunek<select id="mirror-direction"><option value="both">Oba kierunki</option><option value="receive">Tylko odbierany</option><option value="transmit">Tylko wysyłany</option></select></label><label>Na port (Wireshark)<select id="mirror-dest"></select></label><button class="btn primary" type="submit">Uruchom mirroring</button></form><p class="mon-note">Porty chronione (PROTECTED_PORTS) nie mogą być portem docelowym.</p></section>
